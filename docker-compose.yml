# Single-server deployment: MongoDB (single-node replica set), API, web.
#   cp server/.env.example server/.env   # fill in production values
#   docker compose up -d --build
# Put HTTPS in front of port 8080 (see docs/DEPLOYMENT.md).
services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Initialises the replica set on first start, then reports health.
    healthcheck:
      # Exits non-zero until the replica set has a primary, so the API waits.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    # Not published to the host: only the API can reach the database.

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/sfa_cms?replicaSet=rs0
      STORAGE_DIR: /app/storage
      TRUST_PROXY: "true"
    volumes:
      - attachments:/app/storage
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # HTTPS reverse proxy on the host forwards here
    depends_on:
      - api

volumes:
  mongo-data:
  attachments:
